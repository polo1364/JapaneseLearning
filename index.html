<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#fbf3e4">
    <title>商店街物語 LinguaMachi</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="icons/favicon-64.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="商店街物語">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg: #eef7ea;
            --card: #ffffff;
            --ink: #24331f;
            --muted: #6b7a66;
            --line: #dfe9da;
            --green: #58b947; --green-d: #3e8e31; --green-t: #e5f5df;
            --orange: #ff9f1c; --orange-d: #d67e00; --orange-t: #fff1dc;
            --red: #ef5a5a; --red-d: #c43d3d; --red-t: #fde7e7;
            --blue: #3b9ae1; --blue-d: #2675b5; --blue-t: #e3f1fc;
            --purple: #8e6cef; --purple-d: #6a4bc9; --purple-t: #efeafd;
            --gold: #ffc93c; --gold-d: #d9a514;
            color-scheme: light;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            margin: 0; background: var(--bg); color: var(--ink);
            font-family: 'Nunito', 'Noto Sans TC', system-ui, sans-serif; font-weight: 700;
            -webkit-font-smoothing: antialiased; overscroll-behavior: none;
        }
        button { font: inherit; color: inherit; cursor: pointer; }
        input, select { font: inherit; }

        /* ===== 立體按鈕 ===== */
        .btn {
            --c: var(--green); --cd: var(--green-d);
            display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
            background: var(--c); color: #fff; border: none; border-radius: 16px;
            box-shadow: 0 4px 0 var(--cd); padding: .9rem 1.2rem; font-weight: 900; letter-spacing: .02em;
            transition: transform .08s, box-shadow .08s, filter .15s; user-select: none;
        }
        .btn:hover { filter: brightness(1.05); }
        .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--cd); }
        .btn:disabled { --c: #c9d3c5; --cd: #aab5a6; cursor: not-allowed; }
        .btn.orange { --c: var(--orange); --cd: var(--orange-d); }
        .btn.red { --c: var(--red); --cd: var(--red-d); }
        .btn.blue { --c: var(--blue); --cd: var(--blue-d); }
        .btn.purple { --c: var(--purple); --cd: var(--purple-d); }
        .btn.white { --c: #fff; --cd: var(--line); color: var(--ink); border: 2px solid var(--line); }
        .btn.sm { padding: .5rem .8rem; border-radius: 12px; font-size: .85rem; box-shadow: 0 3px 0 var(--cd); }
        .btn.sm:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--cd); }

        .card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; }
        .pill { display: inline-flex; align-items: center; gap: .3rem; border-radius: 999px; padding: .3rem .7rem; font-weight: 900; font-size: .85rem; }

        /* ===== 選項按鈕 ===== */
        .opt {
            width: 100%; text-align: left; background: #fff; border: 2px solid var(--line); border-bottom-width: 5px;
            border-radius: 16px; padding: .95rem 1rem; font-size: 1.05rem; font-weight: 800; display: flex; align-items: center; gap: .7rem;
            transition: transform .08s, border-color .15s, background .15s;
        }
        .opt:hover:not(:disabled) { border-color: #b9d7f0; background: #f6fbff; }
        .opt:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
        .opt .k { flex-shrink: 0; width: 1.7rem; height: 1.7rem; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: .75rem; color: var(--muted); }
        .opt.ok { border-color: var(--green); background: var(--green-t); color: var(--green-d); }
        .opt.bad { border-color: var(--red); background: var(--red-t); color: var(--red-d); animation: shake .4s; }
        .opt:disabled { cursor: default; }
        .opt.center { justify-content: center; text-align: center; }

        /* ===== 字母方塊 ===== */
        .tile {
            min-width: 2.8rem; height: 3rem; padding: 0 .6rem; border-radius: 12px; background: #fff; border: 2px solid var(--line); border-bottom-width: 5px;
            font-size: 1.35rem; font-weight: 900; display: grid; place-items: center; text-transform: lowercase; transition: transform .08s, opacity .15s;
        }
        .tile:active { transform: translateY(2px); border-bottom-width: 3px; }
        .tile.used { opacity: .25; pointer-events: none; }
        .slot { min-width: 2.2rem; height: 3rem; border-bottom: 4px solid #c9d6c3; display: grid; place-items: center; font-size: 1.5rem; font-weight: 900; margin: 0 2px; }
        .slot.fixed { border-color: transparent; color: var(--muted); min-width: 1rem; }
        .slot.filled { color: var(--blue-d); border-color: var(--blue); }

        /* ===== 怪獸 ===== */
        .monster-wrap { position: relative; display: inline-block; line-height: 1; cursor: pointer; user-select: none; }
        .monster { display: inline-block; animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; filter: drop-shadow(0 10px 0 rgba(36, 51, 31, .08)); }
        .monster-wrap.hop .monster { animation: hop .5s; }
        .acc { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; animation: bob 2.6s ease-in-out infinite; }
        .acc.head { top: -32%; }
        .acc.face { top: 22%; }
        /* Q 版圖：配件依每個型態的臉部錨點定位（left/top/rotate 由 accHTML 寫在 style） */
        .acc.fit { line-height: 1; }
        .shadow { width: 60%; height: 12px; margin: 4px auto 0; border-radius: 50%; background: rgba(36,51,31,.10); animation: shadow 2.6s ease-in-out infinite; }
        @keyframes bob { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.02, .98); } }
        .acc { animation-name: bobacc; }
        @keyframes bobacc { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -8px); } }
        @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.85); opacity: .7; } }
        @keyframes hop { 0% { transform: translateY(0); } 35% { transform: translateY(-28px) rotate(-6deg); } 70% { transform: translateY(0) scale(1.08, .92); } 100% { transform: none; } }

        .bubble { position: relative; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: .6rem .9rem; font-size: .95rem; }
        .bubble::after { content: ''; position: absolute; left: 50%; bottom: -9px; width: 14px; height: 14px; background: #fff; border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }

        /* ===== 怪獸動作 ===== */
        .monster-wrap.a-jump { animation: aJump .7s ease; }
        @keyframes aJump { 30% { transform: translateY(-42px) scale(.95, 1.05); } 55% { transform: translateY(0) scale(1.12, .88); } 75% { transform: translateY(-10px); } }
        .monster-wrap.a-spin { animation: aSpin .9s ease-in-out; }
        @keyframes aSpin { 40% { transform: translateY(-18px) rotate(200deg); } 100% { transform: rotate(360deg); } }
        .monster-wrap.a-look { animation: aLook 1.8s ease-in-out; }
        @keyframes aLook { 20%, 45% { transform: scaleX(-1); } 55%, 100% { transform: none; } }
        .monster-wrap.a-walk { animation: aWalk 3s ease-in-out; }
        @keyframes aWalk { 25% { transform: translateX(-55px); } 30% { transform: translateX(-55px) scaleX(-1); } 70% { transform: translateX(55px) scaleX(-1); } 75% { transform: translateX(55px); } }
        .monster-wrap.a-wiggle { animation: wiggle .45s ease-in-out 2; }
        .monster-wrap.a-chomp { animation: aChomp .7s ease; }
        @keyframes aChomp { 15%, 55% { transform: scale(1.18, .84); } 35%, 75% { transform: scale(.9, 1.1); } }
        .monster-wrap.sleeping .monster { animation: breathe 3.2s ease-in-out infinite; filter: brightness(.8) saturate(.8); }
        @keyframes breathe { 50% { transform: scale(1.04, .96); } }
        .zzz { position: absolute; right: 18%; top: 0; font-size: 1.5rem; pointer-events: none; animation: zzz 2.6s linear infinite; }
        .zzz:nth-child(2) { animation-delay: 1.3s; }
        @keyframes zzz { 0% { transform: translate(0, 10px) scale(.5); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(34px, -60px) scale(1.2); opacity: 0; } }
        .thought { position: absolute; right: 14%; top: 4%; background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: .2rem .5rem; font-size: 1.4rem; animation: pop .3s, fade .4s 2.2s reverse forwards; pointer-events: none; }
        .food-fly { position: absolute; left: 50%; bottom: 0; font-size: 2.6rem; pointer-events: none; animation: foodFly .65s cubic-bezier(.3,.7,.4,1) forwards; }
        @keyframes foodFly { 0% { transform: translate(-50%, 0) scale(.6) rotate(-20deg); } 70% { transform: translate(-50%, -140px) scale(1.1) rotate(10deg); } 100% { transform: translate(-50%, -110px) scale(0); opacity: 0; } }
        .evo-flash { display: inline-block; animation: evoFlash 2s ease-in forwards; }
        @keyframes evoFlash { 0% { filter: none; } 15%, 35%, 55%, 75% { filter: brightness(0) invert(1) drop-shadow(0 0 14px #ffd43b); } 25%, 45%, 65% { filter: none; } 100% { filter: brightness(0) invert(1) drop-shadow(0 0 40px #ffd43b); transform: scale(1.35); } }
        .reveal { display: inline-block; animation: reveal .7s cubic-bezier(.2,1.5,.4,1); }
        @keyframes reveal { from { transform: scale(.2) rotate(-30deg); filter: brightness(3); } }
        .crack { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.2rem; pointer-events: none; }

        /* ===== 小遊戲 ===== */
        .arena { position: relative; overflow: hidden; border-radius: 22px; border: 2px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; }
        .arena.hurt { animation: shake .35s; }
        .fall { position: absolute; top: 0; transform: translateX(-50%); padding: .35rem .75rem; border-radius: 12px; background: #fff; border: 2px solid var(--line); border-bottom-width: 4px; font-weight: 900; white-space: nowrap; pointer-events: none; }
        .bub { position: absolute; border-radius: 50%; display: grid; place-items: center; text-align: center; font-weight: 900; line-height: 1.1; padding: 8px; cursor: pointer;
            background: radial-gradient(circle at 32% 28%, #ffffff 0 14%, #e4f3ff 30%, #b9defc 75%, #9ccff8 100%); border: 2px solid #a8d6fb; color: #1f4e7a; box-shadow: inset -6px -8px 0 rgba(255,255,255,.35); }
        .bub.pop { animation: popOut .22s forwards; pointer-events: none; }
        .bub.no { animation: shake .3s; }
        @keyframes popOut { to { transform: scale(1.6); opacity: 0; } }
        .score-pop { position: absolute; font-weight: 900; font-size: 1.3rem; pointer-events: none; animation: scorePop .8s ease-out forwards; }
        @keyframes scorePop { from { transform: translate(-50%, 0); opacity: 1; } to { transform: translate(-50%, -50px); opacity: 0; } }
        .mcard { aspect-ratio: 4 / 5; perspective: 700px; border: none; background: none; padding: 0; }
        .mcard-in { position: relative; width: 100%; height: 100%; transition: transform .35s; transform-style: preserve-3d; }
        .mcard.flip .mcard-in { transform: rotateY(180deg); }
        .mface { position: absolute; inset: 0; border-radius: 16px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; font-weight: 900; padding: 6px; text-align: center; word-break: break-word; }
        .mback { background: var(--green); box-shadow: 0 4px 0 var(--green-d); font-size: 2rem; }
        .mfront { background: #fff; border: 2px solid var(--line); transform: rotateY(180deg); font-size: .95rem; }
        .mcard.done .mfront { background: var(--green-t); border-color: var(--green); color: var(--green-d); }
        .mcard.miss .mfront { border-color: var(--red); background: var(--red-t); }

        /* ===== Fluent 3D 圖示 ===== */
        .fe { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -0.22em; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-drag: none; }
        .monster .fe, .acc .fe, .b-mon .fe, .monster-wrap .fe { width: 1em; height: 1em; vertical-align: bottom; }
        .tab .ico .fe { width: 1.7rem; height: 1.7rem; vertical-align: middle; }
        /* Q 版原創美術：圖已裁到貼邊，放大一點讓角色更有存在感 */
        .fe.art { width: 1.3em; height: 1.3em; vertical-align: -0.3em; }
        .monster .fe.art, .b-mon .fe.art, .monster-wrap .fe.art { width: 1.15em; height: 1.15em; vertical-align: bottom; }

        /* ===== 場景（純 CSS，不用 SVG） ===== */
        .scene { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--sky-a) 0%, var(--sky-b) 100%); }
        .scene::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(150px 150px at 90% -6%, rgba(255, 236, 150, .55), transparent 70%),
                radial-gradient(34px 16px at 16% 9%, rgba(255,255,255,.95) 70%, transparent 72%),
                radial-gradient(48px 20px at 23% 7%, rgba(255,255,255,.95) 70%, transparent 72%),
                radial-gradient(30px 14px at 29% 10%, rgba(255,255,255,.95) 70%, transparent 72%),
                radial-gradient(40px 16px at 72% 15%, rgba(255,255,255,.8) 70%, transparent 72%),
                radial-gradient(54px 20px at 80% 13%, rgba(255,255,255,.8) 70%, transparent 72%);
            animation: drift 18s ease-in-out infinite alternate; }
        @keyframes drift { to { transform: translateX(22px); } }
        .scene::after { content: ''; position: absolute; left: -15%; right: -15%; top: 250px; bottom: 0; pointer-events: none; z-index: 0;
            border-radius: 50% 50% 0 0 / 70px 70px 0 0;
            background: radial-gradient(ellipse 30% 26px at 50% 8px, rgba(0,0,0,.08), transparent 70%), linear-gradient(180deg, var(--ground) 0, var(--ground-d) 100%);
            box-shadow: inset 0 6px 0 rgba(255,255,255,.35); }
        .scene > * { position: relative; z-index: 1; }
        .scene > .deco { position: absolute; }
        .scene.dark #mon-bubble, .scene.dark .bubble { color: var(--ink); }
        .trail { border-radius: 26px; background: radial-gradient(circle at 2px 2px, rgba(36,51,31,.07) 1.5px, transparent 0) 0 0 / 20px 20px, linear-gradient(180deg, var(--rt) 0%, rgba(255,255,255,0) 100%); }

        /* ===== 競技場 ===== */
        .battle-field { position: relative; height: 290px; border-radius: 22px; overflow: hidden; border: 2px solid var(--line);
            background: radial-gradient(ellipse 60% 18% at 78% 47%, rgba(120,170,90,.45), transparent 70%),
                        radial-gradient(ellipse 65% 18% at 25% 92%, rgba(120,170,90,.5), transparent 70%),
                        linear-gradient(180deg, #bfe3ff 0%, #e6f6ff 45%, #d4efc4 46%, #bfe3a8 100%); }
        .b-mon { position: absolute; font-size: 84px; line-height: 1; animation: bob 2.4s ease-in-out infinite; }
        .b-mon.me { font-size: 96px; }
        .b-mon.me > span { display: inline-block; transform: scaleX(-1); }
        .b-mon.hit { animation: hitFlash .45s; }
        @keyframes hitFlash { 0%, 100% { opacity: 1; } 20%, 60% { opacity: .2; transform: translateX(-6px); } 40%, 80% { opacity: 1; transform: translateX(6px); } }
        .b-mon.lunge-me { animation: lungeMe .4s ease; }
        @keyframes lungeMe { 50% { transform: translate(60px, -40px); } }
        .b-mon.lunge-foe { animation: lungeFoe .4s ease; }
        @keyframes lungeFoe { 50% { transform: translate(-60px, 40px); } }
        .b-shadow { position: absolute; width: 90px; height: 14px; border-radius: 50%; background: rgba(36,51,31,.18); }
        .hp-card { position: absolute; width: 46%; background: rgba(255,255,255,.92); border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px; z-index: 2; }
        .move { width: 100%; display: flex; align-items: center; gap: .7rem; padding: .7rem .9rem; border-radius: 16px; background: #fff; border: 2px solid var(--line); border-bottom-width: 5px; font-weight: 800; transition: transform .08s; }
        .move:active:not(:disabled) { transform: translateY(2px); border-bottom-width: 3px; }
        .move:disabled { opacity: .45; cursor: not-allowed; }

        .badge { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .55rem .2rem .45rem; border-radius: 16px; background: #f6f9f4; border: 2px solid var(--line); }
        .badge.got { background: linear-gradient(180deg, #fffbea, #fff1c2); border-color: #f3d77b; box-shadow: 0 3px 0 #e8c75a; }
        .badge .b-ico { font-size: 1.9rem; line-height: 1.1; }
        .badge .b-name { font-size: .65rem; font-weight: 900; text-align: center; line-height: 1.2; }
        .badge .b-bar { width: 80%; height: 4px; border-radius: 4px; background: #e3ebdf; overflow: hidden; margin-top: 2px; }
        .badge .b-bar i { display: block; height: 100%; background: var(--gold); }

        .float-heart { position: absolute; bottom: 40%; font-size: 1.6rem; pointer-events: none; animation: floatUp 1.3s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-110px) scale(1.2); opacity: 0; } }
        .deco { position: absolute; font-size: 1.6rem; opacity: .55; pointer-events: none; }
        .act { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .6rem .2rem; border-radius: 16px; background: rgba(255,255,255,.85); border: 2px solid var(--line); border-bottom-width: 4px; font-size: .78rem; font-weight: 900; transition: transform .08s; }
        .act:active { transform: translateY(2px); border-bottom-width: 2px; }
        .act .i { font-size: 1.6rem; line-height: 1.1; }
        .mini { flex-shrink: 0; width: 76px; text-align: center; padding: .5rem .2rem; border-radius: 16px; background: #fff; border: 2px solid var(--line); }
        .mini.on { border-color: var(--green); background: var(--green-t); }

        /* ===== 進度條 ===== */
        .bar { height: 14px; background: #e3ebdf; border-radius: 999px; overflow: hidden; }
        .bar > i { display: block; height: 100%; border-radius: 999px; background: var(--green); transition: width .5s cubic-bezier(.3,1.3,.5,1); position: relative; }
        .bar > i::after { content: ''; position: absolute; left: 8px; right: 8px; top: 3px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.4); }

        /* ===== 地圖節點 ===== */
        .node { position: relative; width: 74px; height: 68px; border-radius: 50%; border: none; display: grid; place-items: center; font-size: 1.7rem; color: #fff;
            background: var(--nc, var(--green)); box-shadow: 0 7px 0 var(--ncd, var(--green-d)); transition: transform .1s, box-shadow .1s; }
        .node:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ncd, var(--green-d)); }
        .node.locked { --nc: #d5ddd1; --ncd: #b7c2b2; color: #95a290; cursor: not-allowed; }
        .node.boss { width: 92px; height: 84px; font-size: 2.4rem; }
        .node.current::before { content: ''; position: absolute; inset: -9px; border-radius: 50%; border: 4px solid var(--nc, var(--green)); opacity: .35; animation: ring 1.6s ease-out infinite; }
        @keyframes ring { from { transform: scale(.9); opacity: .5; } to { transform: scale(1.25); opacity: 0; } }
        .node-stars { position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%); font-size: .8rem; white-space: nowrap; letter-spacing: -1px; }
        .start-tag { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); background: #fff; border: 2px solid var(--line); color: var(--nc); border-radius: 12px; padding: .25rem .6rem; font-size: .8rem; font-weight: 900; white-space: nowrap; animation: float 1.6s ease-in-out infinite; }
        .start-tag::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; background: #fff; border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateX(-50%) rotate(45deg); }
        @keyframes float { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -5px); } }

        /* ===== 底部導航 ===== */
        .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #fff; border-top: 2px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
        .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: .55rem 0 .5rem; font-size: .72rem; color: var(--muted); border: none; background: none; border-radius: 14px; }
        .tab .ico { font-size: 1.5rem; line-height: 1; filter: grayscale(.85); opacity: .7; transition: transform .15s; }
        .tab.active { color: var(--green-d); }
        .tab.active .ico { filter: none; opacity: 1; transform: translateY(-2px) scale(1.1); }

        /* ===== 遊戲覆蓋層 ===== */
        .overlay { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
        .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom)); transform: translateY(110%); transition: transform .25s cubic-bezier(.2,.9,.3,1.1); }
        .sheet.show { transform: none; }
        .sheet.good { background: #d7f2cf; }
        .sheet.bad { background: #fbdcdc; }

        .modal-bg { position: fixed; inset: 0; z-index: 60; background: rgba(30, 45, 25, .45); display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fade .2s; }
        .modal { width: 100%; max-width: 420px; max-height: 90dvh; overflow-y: auto; animation: pop .35s cubic-bezier(.2,1.4,.4,1); }

        @keyframes fade { from { opacity: 0; } }
        @keyframes pop { from { transform: scale(.85); opacity: 0; } }

// 工具

const $ = id => document.getElementById(id);
function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function safeParse(s) { try { return JSON.parse(s); } catch { return null; } }
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function clamp(v, a = 0, b = 100) { return Math.max(a, Math.min(b, v)); }
function dateStr(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

function fluentUrl(e) {
    const v = FLUENT[e] || FLUENT[e + '️'] || FLUENT[e.replace(/️/g, '')];
    if (!v) return null;
    const skin = v[0] === '!';
    const [folder, slug] = (skin ? v.slice(1) : v).split('|');
    return `${FLUENT_CDN}${encodeURIComponent(folder)}/${skin ? 'Default/' : ''}3D/${slug}_3d${skin ? '_default' : ''}.png`;
}
const FLUENT_RE = new RegExp('(' + Object.keys(FLUENT)
    .flatMap(k => [k, k.replace(/️/g, '')])
    .filter((k, i, a) => k && a.indexOf(k) === i)
    .sort((a, b) => b.length - a.length)
    .map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\uFE0F?')
    .join('|') + ')', 'gu');
const FLUENT_TEST = new RegExp(FLUENT_RE.source, 'u');
const FLUENT_SKIP = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'INPUT', 'OPTION', 'SELECT', 'TITLE', 'NOSCRIPT']);
let fluentOn = true;

function fluentImg(e) {

    img.className = 'fe'; img.alt = e; img.draggable = false; img.decoding = 'async';
    img.src = fluentUrl(e);
    img.onerror = () => { const s = document.createElement('span'); s.className = 'no-fe'; s.textContent = e; img.replaceWith(s); };
    return img;
}
function fluentify(root) {
    if (!fluentOn || !root) return;
    if (root.nodeType === 3) { fluentText(root); return; }
    if (root.nodeType !== 1 || FLUENT_SKIP.has(root.nodeName) || root.closest?.('.no-fe')) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
        acceptNode: n => (n.parentElement && !FLUENT_SKIP.has(n.parentElement.nodeName) && !n.parentElement.closest('.no-fe') && FLUENT_TEST.test(n.data)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
    });
    const list = [];
    while (walker.nextNode()) list.push(walker.currentNode);
    list.forEach(fluentText);
}
function fluentText(node) {
    const p = node.parentElement;
    if (!p || FLUENT_SKIP.has(p.nodeName) || p.closest('.no-fe')) return;
    const text = node.data;
    if (!FLUENT_TEST.test(text)) return;
    FLUENT_RE.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = FLUENT_RE.exec(text))) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        frag.appendChild(fluentUrl(m[0]) ? fluentImg(m[0]) : document.createTextNode(m[0]));
        last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));

// 商店街等級：店鋪等級、評鑑與單字量累積成「發展度」
const RANKS = [[0, '無名小巷'], [8, '街角商圈'], [20, '人氣商店街'], [40, '觀光名所'], [70, '傳說商店街']];
function townScore() { return S.shops.reduce((a, s) => a + levelInfo(s).lv, 0) + S.totals.critics * 3 + (S.totals.stars || 0) * 3 + Math.floor(dexCount() / 20); }
function townRank() { const sc = townScore(); let i = 0; while (i + 1 < RANKS.length && sc >= RANKS[i + 1][0]) i++; return i; }
function checkRank() {
    const r = townRank();
    if (r <= (S.rank || 0)) return;

        <button class="btn w-full mt-4" onclick="closeModal()">太棒了！</button></div>`, { sticky: true }); playSound('win'); burst(); });
}
// 營業額：不在線上時店鋪照常營業，最多累積 8 小時；新鮮度和人氣越高賺越多
const INCOME_CAP_H = 8;
function incomeRate() { return S.shops.reduce((a, s) => a + shopIncome(s), 0) * (1 + townRank() * .1); }
function pendingIncome() { return S.lastCollect ? Math.floor(Math.min(INCOME_CAP_H, (Date.now() - S.lastCollect) / 3.6e6) * incomeRate()) : 0; }
function collectIncome() {
    const n = pendingIncome();
    if (n < 1) return toast('還沒有營業額可以收，晚點再來。');
    S.coins += n; S.lastCollect = Date.now();

}

function gainXp(s, n) {
    if (!s || n <= 0) return 0;
    const before = levelInfo(s).lv, tBefore = tierIndex(s);
    const add = Math.max(1, Math.round(n * xpMultiplier(s) * (hasPerk('ramen') ? 1.1 : 1) * (staffSkill(s) === 'xp' ? 1.1 : 1)));
    s.xp += add;
    const after = levelInfo(s).lv;
    if (tierIndex(s) > tBefore) queueModal(() => showRenovate(s, tBefore));
    else if (after > before) toast(`⭐ ${s.name} 升到 Lv.${after}！`, 'gold');
    return add;
}
function addBond(s, n) {
    if (!s) return;
    const h = hearts(s);
    s.bond = clamp(s.bond + n + (hasPerk('ryokan') ? 1 : 0));
    if (hearts(s) > h) toast(`💞 ${s.name} 的常客變多了！（${'❤️'.repeat(hearts(s))}）`, 'good');

function progressLots(n = 1) {
    let ready = false;
    for (const l of S.lots) { if (l.progress < l.need) { l.progress = Math.min(l.need, l.progress + n); if (l.progress >= l.need) ready = true; } }
    if (ready) toast('🪧 有空店面整修完成，可以開張了！', 'gold');
}
function shopSay(s) {

let audioCtx = null;
function playSound(kind) {
    if (!S.sound) return;
    try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const seq = { ok: [[660, 0, .09], [880, .09, .14]], bad: [[220, 0, .18], [160, .12, .2]], coin: [[988, 0, .07], [1319, .07, .18]], win: [[523, 0, .12], [659, .12, .12], [784, .24, .12], [1047, .36, .28]], tap: [[520, 0, .05]] }[kind] || [];
        const t0 = audioCtx.currentTime;
        for (const [f, at, dur] of seq) {
            const o = audioCtx.createOscillator(), g = audioCtx.createGain();
            o.type = kind === 'bad' ? 'sawtooth' : 'triangle'; o.frequency.value = f;
            g.gain.setValueAtTime(.0001, t0 + at);
            g.gain.exponentialRampToValueAtTime(.16, t0 + at + .015);
            g.gain.exponentialRampToValueAtTime(.0001, t0 + at + dur);
            o.connect(g).connect(audioCtx.destination);
            o.start(t0 + at); o.stop(t0 + at + dur + .03);
        }
    } catch {}
}
let jaVoice = null;
function initVoices() {
    try {
        const vs = speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang));
        jaVoice = vs.find(v => /Google|Nanami|Haruka|Kyoko|O-ren|Sayaka/i.test(v.name)) || vs[0] || null;
    } catch {}
}
if ('speechSynthesis' in window) { initVoices(); speechSynthesis.onvoiceschanged = initVoices; }
function speak(text, slow = false) {
    if (!('speechSynthesis' in window) || !text) return;
    try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(String(text).replace(/[（(][^）)]*[）)]/g, ''));
        u.lang = 'ja-JP'; if (jaVoice) u.voice = jaVoice;
        u.rate = (slow ? .6 : 1) * (S.rate || 1);
        speechSynthesis.speak(u);
    } catch {}
}
let recog = null;
function stopListen() { try { recog?.stop(); } catch {} recog = null; }
function listen(onText, onState) {
    const R = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!R) { toast('這個瀏覽器不支援語音輸入，請改用 Chrome 或 Edge。', 'bad'); return; }
    if (recog) { stopListen(); onState?.(false); return; }
    try {
        recog = new R(); recog.lang = 'ja-JP'; recog.interimResults = false; recog.maxAlternatives = 1;
        recog.onresult = e => onText(e.results[0][0].transcript);
        recog.onerror = e => { if (e.error !== 'aborted' && e.error !== 'no-speech') toast('沒聽清楚，再試一次。', 'bad'); };
        recog.onend = () => { recog = null; onState?.(false); };
        recog.start(); onState?.(true);
    } catch { recog = null; onState?.(false); }
}

// ============================================================
// Claude API（瀏覽器直接呼叫；Key 只存在這台裝置）
// ============================================================
class ClaudeError extends Error { constructor(msg, status, retryable = false) { super(msg); this.status = status; this.retryable = retryable; } }

function friendlyError(status, msg) {
    if (status === 401) return 'API Key 無效，請到「我的」重新設定。';
    if (status === 403) return `這把 Key 沒有權限使用 ${model}。`;
    if (status === 404) return `找不到模型 ${model}，請到「我的」換一個。`;
    if (status === 429) return '請求太頻繁或額度用完了，稍等一下再試。';
    if (status === 529) return 'Claude 現在很忙，稍等一下再試。';
    if (status >= 500) return `Claude 服務暫時異常（${status}）。`;
    if (status === 400) return `請求格式錯誤：${msg || '未知原因'}`;
    return msg || `API 錯誤（${status}）`;
}

async function claudeRequest(body, useFallback = true) {
    const headers = {
        'content-type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2026-10-21',
        // 瀏覽器直接呼叫 Claude API 需要此標頭；Key 只存在本機，僅適合個人使用
        'anthropic-dangerous-direct-browser-access': 'true'
    };
    const payload = { ...body };
    // 安全分類器拒答時，由伺服器端自動改用備援模型
    if (useFallback && MODELS_WITH_FALLBACK.includes(payload.model)) {
        headers['anthropic-beta'] = 'server-side-fallback-2026-07-01';
        payload.fallbacks = 'default';
    }
    let res;
    try { res = await fetch(CLAUDE_API_URL, { method: 'POST', headers, body: JSON.stringify(payload) }); }
    catch { throw new ClaudeError('連不上 Claude API，請檢查網路。', 0, true); }
    if (!res.ok) {
        let msg = '';
        try { msg = (await res.json())?.error?.message || ''; } catch {}
        if (res.status === 400 && payload.fallbacks && /fallback/i.test(msg)) return claudeRequest(body, false);
        throw new ClaudeError(friendlyError(res.status, msg), res.status, res.status === 429 || res.status === 529 || res.status >= 500);
    }
    return res.json();
}

async function callClaude({ system, messages, maxTokens = 16000 }) {
    const body = { model, max_tokens: maxTokens, system, messages, output_config: { effort: 'low' } };
    let last;
    for (let i = 0; i < 3; i++) {
        try {
            const data = await claudeRequest(body);
            if (data.stop_reason === 'refusal') throw new ClaudeError('Claude 無法回應這個請求，換個說法試試。', 200);
            const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
            if (!text) throw new ClaudeError('Claude 沒有回傳內容，再試一次。', 200, true);
            return { text, content: data.content };
        } catch (e) {
            last = e;
            if (!(e instanceof ClaudeError) || !e.retryable || i === 2) break;
            await sleep(800 * 2 ** i + Math.random() * 300);
        }
    }
    throw last;
}

function parseJSON(text) {
    let t = text.replace(/```(?:json)?/gi, '').trim();
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a !== -1 && b > a) t = t.slice(a, b + 1);
    return JSON.parse(t);
}

async function callClaudeJSON(system, prompt) {
    for (let i = 0; i < 2; i++) {
        const { text } = await callClaude({ system, messages: [{ role: 'user', content: prompt }] });
        try { return parseJSON(text); } catch { if (i === 1) throw new ClaudeError('AI 回傳的格式看不懂，再試一次。', 200); }
    }
}

const JSON_SYSTEM = `You are the content engine of a Japanese-learning game for Traditional Chinese (Taiwan) speakers.
All Chinese must be natural Traditional Chinese as used in Taiwan (繁體中文), never Simplified Chinese.
Japanese must be natural, modern, standard Japanese.
Reply with one valid JSON object only — no markdown fences, no extra text.`;

function vocabPrompt(street, exclude) {

Learner level: JLPT ${S.level} — ${lv().desc}. ${lv().focus}
(variation #${Math.floor(Math.random() * 1e6)})

Rules:
- Items must fit the topic and level, be genuinely useful for talking with people in Japan, and differ clearly in meaning from each other. Short set phrases are allowed.

}

function grammarPrompt(topic, seen) {
    return `Create a short Japanese grammar lesson about "${topic.value}" (${topic.label}) with 5 multiple-choice questions.
Learner level: JLPT ${S.level} — ${lv().desc}.
(variation #${Math.floor(Math.random() * 1e6)})

Rules:
- "explanation": 2-4 short sentences in Traditional Chinese: when to use it, how to form it, one common mistake.
- "examples": 2-3 objects with a natural Japanese sentence "ja", its hiragana reading "kana", and Traditional Chinese "zh".
- Each question: a Japanese sentence with ___ for the blank (or a short question), exactly 4 options, exactly one correct; "answer" is the 0-based index of the correct option. Add "zh": Traditional Chinese translation of the completed sentence.
- Use varied, realistic everyday contexts. Do not reuse: ${seen.slice(-20).join(' | ') || 'none'}
- "reason": short Traditional Chinese explanation of the answer.

JSON shape:
{"concept":"て形","explanation":"繁體中文解說","examples":[{"ja":"ここに座ってください。","kana":"ここにすわってください。","zh":"請坐這裡。"}],"quiz":[{"question":"ちょっと ___ ください。","options":["待って","待つ","待た","待ち"],"answer":0,"zh":"請稍等一下。","reason":"請求用 て形＋ください"}]}`;
}

function chatSystem(sc, opening) {
    return `You are a friendly Japanese conversation partner for a Traditional Chinese (Taiwan) speaker.
Role-play scenario: "${sc.value}" (${sc.label}). Stay in character as the other person (staff, friend, colleague…).
You have already opened the conversation with: 「${opening}」
Learner level: JLPT ${S.level} — ${lv().desc}. Keep replies to 1-2 short sentences at this level.
All Chinese must be natural Traditional Chinese (繁體中文, Taiwan).

User turns are labelled [JAPANESE] or [CHINESE].
[JAPANESE]: reply in character, keep the conversation going, and assess their Japanese honestly (90-100 native-like, 80-89 minor issues, 70-79 some errors, 60-69 noticeable errors, <60 hard to understand). Romaji input counts as Japanese.
JSON: {"reply":"in-character Japanese reply","kana":"hiragana reading of the reply","chinese":"繁中翻譯","score":85,"feedback":"繁中：好的地方與一個改進建議","corrections":[{"original":"wrong phrase","corrected":"better phrase","reason":"繁中說明"}]}
Use [] for corrections when nothing needs fixing.
[CHINESE]: the learner asks how to say something. Teach 2-3 natural ways, then continue the role-play.
JSON: {"reply":"short in-character Japanese reply","kana":"hiragana reading","chinese":"繁中翻譯","teaching":{"meaning":"使用者想表達的意思","expressions":[{"japanese":"...","kana":"ひらがな","romaji":"...","note":"使用情境（繁中）"}],"tip":"禮貌程度或常見錯誤（繁中）"}}
Reply with one valid JSON object only.`;
}

function knownWords() { return [...new Set([...Object.values(S.dex).map(d => d.word), ...S.legacy])]; }

function cleanWords(words) {
    if (!Array.isArray(words)) return [];
    const seen = new Set(Object.keys(S.dex));
    return words.filter(w => {
        if (!w || typeof w.word !== 'string' || !w.word.trim() || !w.mean) return false;
        w.word = w.word.trim();
        w.kana = String(w.kana || w.word).replace(/\s+/g, '');
        w.romaji = String(w.romaji || '');
        w.mean = String(w.mean).trim();
        if (seen.has(w.word)) return false;
        seen.add(w.word);
        w.distractors = [...new Set((Array.isArray(w.distractors) ? w.distractors : []).map(x => String(x).trim()).filter(x => x && x !== w.mean))].slice(0, 3);
        w.rarity = [1, 2, 3].includes(w.rarity) ? w.rarity : 1;
        // 例句分段：接起來必須和例句完全一樣，否則不出句子重組題
        const strip = x => String(x).replace(/\s+/g, '');
        if (Array.isArray(w.chunks) && w.chunks.length >= 3 && w.chunks.length <= 7 && w.chunks.every(c => typeof c === 'string' && c.trim()) && w.chunks.map(strip).join('') === strip(w.example || '')) w.chunks = w.chunks.map(strip);
        else delete w.chunks;
        return true;
    }).slice(0, WORDS_PER_STAGE);
}

function fetchStageWords(streetId) {
    if (G.prefetch[streetId]) return G.prefetch[streetId];
    const street = STREETS.find(s => s.id === streetId);
    const p = (async () => {
        for (let i = 0; i < 2; i++) {
            const data = await callClaudeJSON(JSON_SYSTEM, vocabPrompt(street, knownWords()));
            const words = cleanWords(data?.words);
            if (words.length >= 3) return words;
        }
        throw new ClaudeError('這次進貨的內容不夠，再試一次。', 200);
    })();
    G.prefetch[streetId] = p;
    p.catch(() => { if (G.prefetch[streetId] === p) delete G.prefetch[streetId]; });
    return p;
}

function prog(id) { return S.progress[id] || (S.progress[id] = { stars: Array(STAGES_PER_STREET).fill(0), boss: false }); }
function streetUnlocked(i) { return i === 0 || prog(STREETS[i - 1].id).boss; }
function stageUnlocked(st, i) { return i === 0 || prog(st.id).stars[i - 1] > 0; }
function criticUnlocked(st) { return prog(st.id).stars.every(s => s > 0); }
function currentStreetIndex() { let i = 0; while (i + 1 < STREETS.length && prog(STREETS[i].id).boss) i++; return i; }
function streetWords(id) { return Object.values(S.dex).filter(d => d.street === id); }
function dueWords() { const t = dateStr(); return Object.values(S.dex).filter(d => d.due && d.due <= t); }
function wrongWords() { return Object.values(S.dex).filter(d => d.needFix); }

function srsCorrect(d) { d.correct = (d.correct || 0) + 1; d.box = Math.min(5, (d.box || 0) + 1); d.due = addDays(SRS_DAYS[d.box]); }
function srsWrong(d) { d.wrong = (d.wrong || 0) + 1; d.box = 1; d.due = addDays(1); d.needFix = true; }

// ---------- 出題 ----------
function wordPool(words) { const m = new Map(); [...words, ...Object.values(S.dex)].forEach(w => { if (!m.has(w.word)) m.set(w.word, w); }); return [...m.values()]; }
function othersOf(w, pool, key, n = 3) {
    const seen = new Set([w[key]]);
    const out = [];
    for (const x of shuffle(pool)) { if (x.word === w.word || !x[key] || seen.has(x[key])) continue; seen.add(x[key]); out.push(x[key]); if (out.length >= n) break; }
    return out;
}
function typesFor(w, pool, choiceOnly = false) {
    const t = ['mean', 'listen'];
    if (othersOf(w, pool, 'word').length >= 3) t.push('reverse');
    if (w.word !== w.kana && othersOf(w, pool, 'kana').length >= 3) t.push('reading');
    if (w.example && w.trans && othersOf(w, pool, 'trans').length >= 3) t.push('exlisten');
    if (!choiceOnly) {
        const len = Array.from(w.kana).length;
        if (len >= 2 && len <= 8) t.push('build');
        t.push('type');
        if (Array.isArray(w.chunks) && w.chunks.length >= 3) t.push('sentence');
    }
    return t;
}
function makeChallenge(w, type, pool) {
    const opts = (right, wrongs, jp) => shuffle([{ label: right, ok: true, jp }, ...wrongs.map(x => ({ label: x, ok: false, jp }))]);
    const meanOpts = () => {
        let d = [...(w.distractors || [])];
        if (d.length < 3) d = [...new Set([...d, ...othersOf(w, pool, 'mean', 6)])].filter(x => x !== w.mean).slice(0, 3);
        while (d.length < 3) d.push(['不知道', '以上皆非', '沒有這個字'][d.length]);
        return opts(w.mean, d.slice(0, 3), false);
    };
    const base = { w, type, answerText: `${w.word}${w.word !== w.kana ? `（${w.kana}）` : ''}＝${w.mean}` };
    switch (type) {
        case 'listen': return { ...base, kind: 'choice', title: '聽聽看，客人說的是什麼意思？', big: '🔊', audio: w.word, audioOnly: true, options: meanOpts() };
        case 'reverse': return { ...base, kind: 'choice', title: '客人要找的是哪一件商品？', big: w.mean, options: opts(w.word, othersOf(w, pool, 'word'), true) };
        case 'reading': return { ...base, kind: 'choice', title: '這個字怎麼唸？', big: w.word, bigJp: true, options: opts(w.kana, othersOf(w, pool, 'kana'), true) };
        case 'exlisten': return { ...base, kind: 'choice', title: '聽例句，選出正確的意思', big: '🔊', audio: w.example, audioOnly: true, answerText: `${w.example}＝${w.trans}`, options: opts(w.trans, othersOf(w, pool, 'trans'), false) };
        case 'sentence': return { ...base, kind: 'build', small: true, title: '把這句話排出來', big: w.trans, answerText: `${w.example}＝${w.trans}`, target: [...w.chunks], tiles: shuffle([...w.chunks]), picked: [] };
        case 'build': {
            const target = Array.from(w.kana);
            const kata = /[ァ-ヺ]/.test(w.kana);
            const src = Array.from(kata ? 'アイウエオカキクケコサシスセソタチツテトナニヌネノマミムメモラリルレロン' : 'あいうえおかきくけこさしすせそたちつてとなにぬねのまみむめもらりるれろん');
            const decoys = shuffle(src.filter(c => !target.includes(c))).slice(0, target.length <= 3 ? 3 : 2);
            return { ...base, kind: 'build', title: '把假名排成這件商品的讀音', big: w.mean, sub: w.word !== w.kana ? w.word : '', target, tiles: shuffle([...target, ...decoys]), picked: [] };
        }
        case 'type': return { ...base, kind: 'type', title: '用假名或羅馬字打出這件商品', big: w.mean, sub: w.word !== w.kana ? `提示：${w.word}` : '', accept: [w.word, w.kana], romaji: w.romaji };
        default: return { ...base, type: 'mean', kind: 'choice', title: '這件商品是什麼意思？', big: w.word, bigJp: true, sub: w.word !== w.kana ? w.kana : '', audio: w.word, options: meanOpts() };
    }
}
function rebuild(ch) { return ch.w && !ch.fixed ? { ...makeChallenge(ch.w, ch.type, G.play.pool || wordPool([])), say: ch.say, retry: true } : { ...ch, options: ch.options ? shuffle(ch.options) : ch.options, retry: true }; }

function replayAudio(slow) { const ch = G.play?.queue[G.play.pos]; if (ch?.audio) speak(ch.audio, slow); }
function renderBuild() {
    const ch = G.play.queue[G.play.pos];
    $('slots').innerHTML = ch.target.map((_, i) => { const t = ch.picked[i]; return `<button class="slot ${t != null ? 'filled' : ''} bg-transparent border-0" style="${ch.small ? 'font-size:1.05rem;' : ''}border-bottom:4px solid ${t != null ? 'var(--blue)' : '#d9cbb6'}" onclick="unpickTile(${i})">${t != null ? esc(ch.tiles[t]) : ''}</button>`; }).join('');

}

// ---------- 判定 ----------
function resolve(ok) {

    S.totals.answered++; markActive(); ensureDaily();
    if (ok) {
        S.totals.correct++; S.daily.correct++; progressLots(1);
        p.combo++; p.maxCombo = Math.max(p.maxCombo, p.combo);

    } else {
        p.wrong++; p.combo = 0;

    const shelf = [], seen = new Set();
    for (const w of shuffle(Object.values(S.dex))) { if (seen.has(w.mean)) continue; seen.add(w.mean); shelf.push(w); if (shelf.length >= 6) break; }
    if (shelf.length < 4) return endOrder();
    p.round++;
    const n = Math.min(shelf.length - 1, p.round >= 4 ? 3 : p.round >= 2 ? 2 : 1);
    const st = pick(STREETS);
    p.cur = { want: shelf.slice(0, n), shelf: shuffle(shelf), got: [], bad: [], miss: 0, guest: st };
    p.cur.line = p.cur.want.map(w => w.word).join('、') + '、お願いします。';
    p.locked = false;
    renderOrder();
    setTimeout(() => { if (G.play === p) speak(p.cur.line); }, 250);

function startMatch() {
    const ws = [], seen = new Set();
    for (const w of shuffle(Object.values(S.dex))) { if (seen.has(w.mean) || seen.has(w.word)) continue; seen.add(w.mean); seen.add(w.word); ws.push(w); if (ws.length >= 6) break; }
    let pairs;
    if (ws.length >= 6) pairs = ws.map(w => [w.word, w.mean, w.word]);
    else { const ks = [], sr = new Set(); for (const k of shuffle(kanaPool('hiragana'))) { if (sr.has(k.romaji)) continue; sr.add(k.romaji); ks.push(k); if (ks.length >= 6) break; } pairs = ks.map(k => [k.kana, k.romaji, k.kana]); }
    const cards = shuffle(pairs.flatMap(([a, b, say], id) => [{ id, text: a, jp: true, say }, { id, text: b, jp: false }]));
    G.play = makeRun('match', { cards, open: [], doneIdx: [], moves: 0, kanaOnly: ws.length < 6 });
    openPlay();
    $('play-foot').innerHTML = '';
    $('play-body').innerHTML = `<div class="anim-in pt-2"><div class="text-sm font-black mb-3" style="color:var(--muted)">把${G.play.kanaOnly ? '假名和讀音' : '商品和它的意思'}配成一對（商品帳滿 6 個單字後會改用你的單字）</div>
        <div class="grid gap-2" style="grid-template-columns:repeat(3, minmax(0, 1fr))">${cards.map((c, i) => `<button class="mcard" data-i="${i}" onclick="flipMatch(${i})"><div class="mcard-in"><div class="mface mback" style="background:var(--pri);box-shadow:0 4px 0 var(--pri-d)">🏮</div><div class="mface mfront ${c.jp ? 'jp' : ''}" style="${c.jp ? 'font-size:1.15rem' : ''}">${esc(c.text)}</div></div></button>`).join('')}</div></div>`;
    syncMatch();
}
function syncMatch() {
    const p = G.play;
    $('play-head').innerHTML = `<button class="border-0 bg-transparent text-2xl font-black px-1" style="color:var(--muted)" onclick="quitPlay()" aria-label="離開">✕</button>
        <div class="bar flex-1"><i style="width:${p.doneIdx.length / p.cards.length * 100}%"></i></div><span class="pill" style="background:#fff6d6;color:#a67c00">🃏 ${p.moves} 步</span>`;
    document.querySelectorAll('#play-body .mcard').forEach((el, i) => {
        const done = p.doneIdx.includes(i);
        el.classList.toggle('flip', done || p.open.includes(i));
        el.classList.toggle('done', done);
    });
}
function flipMatch(i) {
    const p = G.play; if (!p || p.mode !== 'match' || p.locked || p.open.includes(i) || p.doneIdx.includes(i)) return;
    p.open.push(i); playSound('tap');
    const c = p.cards[i]; if (c.say) speak(c.say);
    if (p.open.length === 2) {
        p.moves++;
        const [a, b] = p.open;
        if (p.cards[a].id === p.cards[b].id) {
            p.doneIdx.push(a, b); p.open = []; playSound('ok');
            if (p.doneIdx.length === p.cards.length) { p.locked = true; setTimeout(() => { if (G.play === p) endMatch(); }, 700); }
        } else {
            p.locked = true;
            setTimeout(() => { if (G.play !== p) return; p.open = []; p.locked = false; syncMatch(); }, 900);
        }
    }
    syncMatch();
}
function endMatch() {
    const p = G.play, s = activeShop();

}

        <div class="mt-3 space-y-1 font-black">${lines.map(l => `<div>${l}</div>`).join('')}</div>
        <div class="grid ${again ? 'grid-cols-2' : ''} gap-2 mt-5">${again ? `<button class="btn white" onclick="closeModal(); ${again}">再來一次</button>` : ''}<button class="btn" onclick="closeModal()">好</button></div>
    </div>`, { sticky: true });
    const p = G.play; if (p) p.done = true;
    $('play').classList.add('hidden'); hideSheet(); document.body.style.overflow = '';
    if (p?.timer) clearInterval(p.timer);
    G.play = null; render();
}
function finishRun() {
    const p = G.play, s = activeShop();
    hideSheet();
    if (p.mode === 'stage') {
        const stars = p.wrong === 0 ? 3 : p.wrong <= 2 ? 2 : 1;
        const fresh = p.words.filter(w => !S.dex[w.word]);
        const today = dateStr();
        for (const w of fresh) S.dex[w.word] = { ...w, street: p.street.id, caught: today, correct: 1, wrong: 0, box: 1, due: addDays(1), needFix: false };
        const coins = Math.round((100 + stars * 50 + (p.maxCombo >= 5 ? 100 : 0)) * (hasPerk('konbini') ? 1.2 : 1));
        const xp = gainXp(s, fresh.length * 8 + stars * 4);
        S.coins += coins; S.supplies.rice = (S.supplies.rice || 0) + fresh.length;
        S.daily.new += fresh.length; S.totals.stages++; if (stars === 3) S.totals.perfect++;
        const pr = prog(p.street.id); pr.stars[p.idx] = Math.max(pr.stars[p.idx], stars);
        addBond(s, 1); save(); playSound('win'); if (stars === 3) burst();
        return showResult({ icon: '📦', title: '進貨完成！', stars, lines: [`新商品 ${fresh.length} 件上架`, `💴 +${coins}${p.maxCombo >= 5 ? '（連擊獎勵）' : ''}`, `⭐ 評價 +${xp}・🍙 食材 +${fresh.length}`] });
    }
    if (p.mode === 'critic') {
        const win = p.hearts > 0, pr = prog(p.street.id);
        if (!win) { save(); playSound('bad'); return showResult({ icon: '😣', title: `${p.street.criticName}搖了搖頭…`, lines: ['多盤點幾次這條街的商品，再來挑戰吧。'], again: `startCritic('${p.street.id}', ${!!p.hard})` }); }
        if (p.hard) {
            const firstStar = !pr.star; pr.star = true;
            const coins = firstStar ? 1500 : 200, xp = gainXp(s, firstStar ? 100 : 20);
            S.coins += coins;
            const lines = [`💴 +${coins}`, `⭐ 評價 +${xp}`];
            if (firstStar) { S.totals.stars = (S.totals.stars || 0) + 1; S.supplies.wagyu = (S.supplies.wagyu || 0) + 2; lines.push('🥩 頂級和牛 ×2'); }
            save(); playSound('win'); burst();
            return showResult({ icon: '🌟', title: `${p.street.name}拿到星級評鑑！`, lines });
        }
        const first = !pr.boss; pr.boss = true;
        const coins = first ? 800 : 150, xp = gainXp(s, first ? 60 : 15);
        S.coins += coins;
        const lines = [`💴 +${coins}`, `⭐ 評價 +${xp}`];
        if (first) {
            S.totals.critics++; S.supplies.wagyu = (S.supplies.wagyu || 0) + 1; lines.push('🥩 頂級和牛 ×1');
            if (S.lots.length < MAX_LOTS) { S.lots.push({ id: 'l' + Date.now().toString(36), progress: 0, need: LOT_NEED }); lines.push('🪧 獲得一間空店面！'); }
            const ni = STREETS.findIndex(x => x.id === p.street.id) + 1;
            if (ni < STREETS.length) lines.push(`🔓 解鎖：${STREETS[ni].emoji} ${STREETS[ni].name}`);
        }
        save(); playSound('win'); burst();
        return showResult({ icon: '👑', title: `${p.street.criticName}給了好評！`, lines });
    }
    const n = p.first;
    if (p.mode === 'review') {
        const coins = n * 10 * (hasPerk('sushi') ? 2 : 1), xp = gainXp(s, n * 2);
        S.coins += coins; setFresh(s, freshness(s) + n * 3);
        save(); playSound('win');
        return showResult({ icon: '📚', title: '盤點完成！', lines: [`第一次就答對 ${n}/${p.queue.filter(c => !c.retry).length} 題`, `💴 +${coins}・⭐ 評價 +${xp}`, `🍙 新鮮度 +${n * 3}`] });
    }
    if (p.mode === 'grammar') {
        const coins = n * 20, xp = gainXp(s, n * 3);
        S.coins += coins; S.totals.grammar++;
        S.grammarSeen = [...S.grammarSeen, ...p.queue.filter(c => !c.retry).map(c => c.big)].slice(-60);
        save(); playSound('win');
        return showResult({ icon: '🏯', title: '修行完成！', lines: [`第一次就答對 ${n} 題`, `💴 +${coins}・⭐ 評價 +${xp}`] });
    }
    // 五十音
    const coins = n * 5, xp = gainXp(s, n);
    S.coins += coins; save(); playSound('win');
    showResult({ icon: '🈁', title: '練習完成！', lines: [`第一次就答對 ${n}/10 題`, `💴 +${coins}・⭐ 評價 +${xp}`], again: `startKana('${p.script}')` });
}

async function sendChat() {
    const c = G.chat, el = $('chat-in'); if (!c || c.busy || !el) return;
    const text = el.value.trim(); if (!text) return;
    // 有假名或純英數（羅馬字）當作日文；只有漢字當作中文提問
    const isJa = hasKana(text) || !hasCJK(text);
    const me = { role: 'me', text };
    c.msgs.push(me); c.history.push({ role: 'user', content: `[${isJa ? 'JAPANESE' : 'CHINESE'}] ${text}` });
    c.busy = true; renderChat();
    try {
        const { text: raw, content } = await callClaude({ system: c.system, messages: c.history, maxTokens: 8000 });
        if (G.chat !== c) return;
        let d; try { d = parseJSON(raw); } catch { d = { reply: raw, chinese: '' }; }
        // 回傳的完整 content（含 thinking 區塊）原樣放回對話紀錄
        c.history.push({ role: 'assistant', content });
        while (c.history.length > 24) c.history.splice(0, 2);
        if (isJa && Number.isFinite(d.score)) {
            const s = activeShop();
            me.score = Math.round(clamp(d.score)); me.feedback = d.feedback || ''; me.corrections = Array.isArray(d.corrections) ? d.corrections.filter(x => x && x.original && x.corrected) : [];
            me.coins = me.score >= 60 ? Math.round(me.score / 2) : 10;
            S.coins += me.coins; S.totals.chats++; ensureDaily(); S.daily.chat++; markActive();
            addBond(s, 2); gainXp(s, 3); setPop(s, popularity(s) + 3);
            playSound(me.score >= 60 ? 'coin' : 'tap');
        }
        c.msgs.push({ role: 'ai', text: String(d.reply || ''), kana: d.kana || '', chinese: d.chinese || '', teaching: d.teaching && Array.isArray(d.teaching.expressions) ? d.teaching : null });
        c.busy = false; save(); renderChat(); speak(d.reply);
    } catch (e) {
        if (G.chat !== c) return;
        c.busy = false; c.msgs.pop(); c.history.pop();
        renderChat(); const again = $('chat-in'); if (again) again.value = text;
        toast(e.message || '送出失敗，再試一次。', 'bad', 4000);
    }
}

    const name = ($('w-name')?.value || '').trim() || 'まいど屋';
    S.level = $('w-level')?.value || 'N5';
    const shop = newShop('yatai', name.slice(0, 12));
    S.shops.push(shop); S.active = shop.id; S.lastCollect = Date.now();
    save(); closeModal(); render(); burst(); startTour();
    if (S.migrated) { delete S.migrated; save(); toast('已把舊版 LinguaMax 的經驗值換成日圓，學過的單字不會重複出現。', 'gold', 5000); }
    checkLogin();
}

document.addEventListener('keydown', e => {
    const p = G.play; if (!p || p.loading || G.modalOpen || G.tour) return;
    const typing = e.target?.tagName === 'INPUT';
    if (e.key === 'Enter') {
        if ($('sheet').classList.contains('show')) { e.preventDefault(); nextChallenge(); }
        else if (!typing) { const b = $('play-foot').querySelector('button:not(:disabled)'); if (b) { e.preventDefault(); b.click(); } }
        return;
    }
    if (typing) return;
    if (/^[1-4]$/.test(e.key) && !p.locked) answerOption(Number(e.key) - 1);
    else if (e.key === ' ') { e.preventDefault(); replayAudio(); }
    else if (e.key.toLowerCase() === 's') replayAudio(true);
});
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
// 新鮮度與人氣會隨時間下降：停在首頁時每分鐘更新一次
setInterval(() => { if (G.tab === 'home' && !G.play && !G.modalOpen && document.visibilityState === 'visible') renderHomeStats(); }, 60000);

ensureDaily();
fluentify(document.body);
render();
if (!S.shops.length) openWelcome(); else checkLogin();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
